{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Todo App</title>

    <link
        rel="stylesheet"
        href="{% static 'todos/style.css' %}"
    >

</head>


<body class="auth-body">


<div class="auth-container">


    <div class="auth-card">


        <div class="auth-logo">
            Todo App
        </div>


        <h1>
            Create Account
        </h1>


        <p class="auth-subtitle">
            Start managing your tasks today.
        </p>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message {{ message.tags }}">

                        {{ message }}

                    </div>

                {% endfor %}

            </div>

        {% endif %}



        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-btn"
            >
                Create Account
            </button>


        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>


    </div>


</div>


</body>

</html>
